services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      APP_NAME: "Plant Assistant"
      APP_ENV: local
      APP_KEY: "${DOCKER_APP_KEY:-base64:R1QhrP6QP/62TMk5IRKJFAlzCFZKuTVKb/QW7AatV5g=}"
      APP_DEBUG: "true"
      APP_URL: "http://localhost:${FRONTEND_PORT:-8080}"
      LOG_CHANNEL: stderr
      LOG_LEVEL: debug
      DB_CONNECTION: pgsql
      DB_HOST: "${DOCKER_DB_HOST:-db}"
      DB_PORT: "${DOCKER_DB_PORT:-5432}"
      DB_DATABASE: "${DOCKER_DB_DATABASE:-plantAssistant}"
      DB_USERNAME: "${DOCKER_DB_USERNAME:-postgres}"
      DB_PASSWORD: "${DOCKER_DB_PASSWORD:-password}"
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      OCTANE_SERVER: roadrunner
      OCTANE_RPC_PORT: 6001
      OCTANE_MAX_REQUESTS: 500
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      RUN_SEEDERS: "${RUN_SEEDERS:-false}"
      SANCTUM_STATEFUL_DOMAINS: "localhost,localhost:${FRONTEND_PORT:-8080},127.0.0.1,127.0.0.1:${FRONTEND_PORT:-8080}"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${DOCKER_DB_DATABASE:-plantAssistant}"
      POSTGRES_USER: "${DOCKER_DB_USERNAME:-postgres}"
      POSTGRES_PASSWORD: "${DOCKER_DB_PASSWORD:-password}"
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  backend_storage:
  postgres_data:
